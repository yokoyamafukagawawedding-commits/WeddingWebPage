<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>サイリウム画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-page">
  <main class="light-menu" id="lightMenu">
    <a class="back-link" href="index.html">← トップへ戻る</a>
    <div class="light-card">
      <p class="eyebrow">DRESS COLOR QUIZ</p>
      <h1>サイリウム</h1>
      <p>お色直し入場の際に、投票した色をタップしてください。画面の明るさを最大にすると、よりきれいに見えます。</p>

      <div class="color-grid" id="colorGrid"></div>

      <button class="button outline full" id="lastColorButton" hidden>前回の色を表示</button>
      <!-- <p class="light-note">色の画面をタップすると、この選択画面に戻ります。</p> -->

      <section class="my-answer" id="myAnswer" aria-labelledby="myAnswerTitle">
        <button class="my-answer__heading" id="myAnswerToggle" type="button" aria-expanded="false" aria-controls="myAnswerContent">
          <span class="my-answer__heading-copy">
            <span class="my-answer__title" id="myAnswerTitle">回答を確認</span>
            <span class="my-answer__description">投票した色を確認できます。</span>
          </span>
          <span class="my-answer-toggle" aria-hidden="true">▼</span>
        </button>
        <div class="my-answer__content" id="myAnswerContent" hidden>
        <div class="my-answer__fields">
          <label>招待者
            <select id="sideSelect" disabled>
              <option value="">選択してください</option>
              <option value="新郎">新郎</option>
              <option value="新婦">新婦</option>
            </select>
          </label>
          <label>名前
            <select id="nameSelect" disabled>
              <option value="">先に招待者を選択してください</option>
            </select>
          </label>
        </div>
        <p id="answerStatus" class="answer-status" aria-live="polite">回答データを取得しています。</p>
        <div id="myAnswerResult" class="my-answer__result" hidden></div>
        <button class="button outline update-button" id="refreshAnswersButtonSecondary" type="button">更新</button>
        </div>
      </section>
    </div>
  </main>

  <section class="color-screen" id="colorScreen" hidden role="button" tabindex="0" aria-label="タップして色選択へ戻る">
    <div class="color-screen__hint">画面をタップして戻る</div>
  </section>

  <script src="config.js"></script>
  <script src="light.js"></script>
</body>
</html>
